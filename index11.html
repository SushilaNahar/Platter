<style>
:root[data-theme="light"] {
  --bg: #f6f2e6; --surface: #ffffff; --ink: #3d2a35; --muted: #7b7a76;
  --line: #e9e0c8; --line-strong: #d6cba9;
  --accent: #c25e2c; --brand: #c25e2c; --accent-ink: #ffffff;
  --accent-text: #b4531f; --mark: #f5e4bd; --mark-ink: #3d2a35; --soft: #ece6d2;
  --chip-bg: #e4e7de; --chip-ink: #5f6e50; --chip2-bg: #f5e4bd; --chip2-ink: #3d2a35;
  --good-bg: #dcefe2; --good-ink: #1f6b3c; --ok-bg: #f6ebc4; --ok-ink: #7a5a00; --bad-bg: #f8dcd7; --bad-ink: #a3361f;
  color-scheme: light;
}
:root[data-theme="light"] .btn.danger { color: #a3361f; border-color: #a3361f; }
:root[data-theme="light"] .act.dang span { color: #a3361f; }
:root {
  /* Claude warm-gray dark theme with Clay accent. Dark only. */
  --bg: #262624;
  --surface: #30302e;
  --ink: #faf9f5;
  --muted: #b0aea5;
  --line: #3d3d3a;
  --line-strong: #5e5d59;
  --brand: #d97757;
  --accent: #d97757;
  --accent-text: #d97757;
  --accent-ink: #141413;
  --mark: #5a3326;
  --mark-ink: #faf9f5;
  --soft: #3d3d3a;
  --chip-bg: #3a3a37; --chip-ink: #b8c4a4; --chip2-bg: #4a3a2a; --chip2-ink: #f0d9a8;
  --good-bg: #1f3a2a; --good-ink: #8fd6ab; --ok-bg: #3d3418; --ok-ink: #e8c872; --bad-bg: #43211d; --bad-ink: #f0a79c;
  --display: 'Anthropic Serif', Georgia, 'Times New Roman', Times, serif;
  --body: 'Anthropic Sans', system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.15; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; }
header { padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 12px; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.topline h1 { font-size: 22px; }
.topline p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--muted); min-height: 36px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.tonight { background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tonight small { display: block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
.tonight strong { font-family: var(--display); font-size: 21px; display: block; margin: 2px 0; }
.tonight span { font-size: 13px; opacity: .9; }
.tonight button { background: #ffffff; color: var(--accent-text); border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; min-height: 44px; white-space: nowrap; }

main { flex: 1; overflow-y: auto; padding: 8px 16px 24px; }
nav { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom); }
nav button { border: 0; background: transparent; padding: 12px 8px; font-size: 14px; font-weight: 500; color: var(--muted); min-height: 52px; position: relative; }
nav button[aria-current="page"] { color: var(--accent-text); font-weight: 700; }
nav button[aria-current="page"]::after { content: ""; position: absolute; left: 25%; right: 25%; top: 0; height: 3px; background: var(--brand); border-radius: 0 0 3px 3px; }

.list { display: flex; flex-direction: column; gap: 10px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; }
.day.today { border-color: var(--mark); box-shadow: inset 4px 0 0 var(--mark); }
.dow { font-family: var(--display); font-weight: 700; font-size: 18px; }
.dow small { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; color: var(--mark-ink); background: var(--mark); border-radius: 6px; padding: 1px 5px; width: fit-content; margin-top: 2px; }
.dish { border: 0; background: transparent; padding: 0; text-align: left; font-weight: 700; font-size: 17px; }
.meta { color: var(--muted); font-size: 13px; margin-top: 2px; }
.side { color: var(--muted); font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-weight: 500; min-height: 40px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

[hidden] { display: none !important; }
.rsearch { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 12px 14px; margin: 4px 0 8px; border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--bg); color: var(--ink); }
.rsearch:focus { outline: none; border-color: var(--brand); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; white-space: nowrap; font-size: 14px; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.card h3 { font-size: 17px; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.card .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.tag { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 7px; background: var(--soft); color: var(--accent-text); }
.tag.new { background: var(--mark); color: var(--mark-ink); }

.addbox { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
.addbox label, .addbox strong { display: block; font-weight: 700; margin-bottom: 8px; }
.addbox p { margin: 8px 0 0; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: inherit; background: var(--bg); color: var(--ink); min-height: 44px; }
.gr-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 12px; }
.gr-head strong { font-family: var(--display); font-size: 18px; }
.gr-head .btns { display: flex; gap: 8px; }
.gr-group { margin-bottom: 16px; }
.gr-group h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.gr-item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 12px; margin-bottom: 6px; min-height: 48px; }
.gr-item input { width: 22px; height: 22px; accent-color: var(--brand); flex: none; }
.gr-item label { flex: 1; display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; cursor: pointer; }
.gr-item .q { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.gr-item.done label { text-decoration: line-through; color: var(--muted); }

  }
  function famJoin(code, name) {
    code = normCode(code); name = name.trim().slice(0, 30);
    if (code.length < 12) return Promise.reject({ msg: 'That code looks too short.' });
    if (!name) return Promise.reject({ msg: 'Type your name first.' });
    return rpc('family_exists', { p_code: code }).then(function (ok) {
      if (!ok) throw { msg: 'No family found with that code.' };
      return rpc('list_recipes', { p_code: code });
    }).then(function (list) {
      var remote = {};
      (list || []).forEach(function (r) { if (!r.deleted) remote[r.id] = r.data; });
      var local = sharedRows(snapshot()), pushes = [];
      Object.keys(local).forEach(function (id) { if (!(id in remote)) pushes.push(rpc('put_recipe', { p_code: code, p_id: id, p_data: local[id], p_by: name })); });
      return Promise.all(pushes).then(function () {
        var merged = {}; Object.keys(local).forEach(function (k) { merged[k] = local[k]; }); Object.keys(remote).forEach(function (k) { merged[k] = remote[k]; });
        var snap = snapshot(), sh = rowsToShared(merged);
        SHARED_KEYS.forEach(function (k) { snap[k] = sh[k]; });
        applySaved(snap); writeLocal();
        fam.code = code; fam.name = name; fam.on = true; fam.lastShared = strMap(sharedRows(snapshot())); fam.lastMenu = ''; fam.menuAt = 0; famPersist();
        try { localStorage.removeItem('platter-skip'); } catch (e) {}
        return famSync({ force: true });
      });
    }).catch(function (e) { if (e && e.msg) throw e; throw { msg: 'Could not reach the family service. Check your connection.' }; });
  }
  function famSwitch(name, isNew) {
    name = name.trim().slice(0, 30); if (!name || name === fam.name) return Promise.resolve();
    return famPush().then(function () {
      return rpc('get_menu', { p_code: fam.code, p_member: name });
    }).then(function (menu) {
      var snap = snapshot();
      if (menu && typeof menu === 'object') ['plan', 'log', 'checked', 'shop', 'notes', 'master', 'mnotes', 'special'].forEach(function (k) { if (menu[k] !== undefined) snap[k] = menu[k]; });
      else { snap.plan = {}; snap.log = {}; snap.checked = {}; snap.shop = {}; snap.notes = {}; snap.master = ''; snap.mnotes = []; snap.special = {}; }
      applySaved(snap); writeLocal();
      fam.name = name; fam.menuAt = menu && menu._at ? Number(menu._at) : 0; fam.lastMenu = JSON.stringify(privateBlob(snapshot())); famPersist();
      state.tab = 'home'; render();
    });
  }
  function famLeave() {
    fam.on = false; fam.code = ''; fam.name = ''; fam.lastShared = {}; fam.lastMenu = ''; fam.menuAt = 0; fam.leave = false;
    try { ['platter-family', 'platter-menu-at', 'platter-last-shared', 'platter-last-menu'].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
  }

  /* ---- family screens ---- */
  function inviteLink() { return location.origin + location.pathname + '?f=' + encodeURIComponent(fam.code); }
  function famFormHtml(prefill) {
    var join = fam.mode === 'join';
    return '<div class="famtabs"><button type="button" class="chip" data-fam="mode" data-m="create" aria-pressed="' + !join + '">Create a family</button><button type="button" class="chip" data-fam="mode" data-m="join" aria-pressed="' + join + '">Join a family</button></div>' +
      '<form id="fam-form" class="famform">' +
      (join ? '<label class="elab" for="fam-code">Family code</label><input id="fam-code" class="einp" type="text" autocomplete="off" autocapitalize="characters" placeholder="XXXX-XXXX-XXXX" value="' + esc(prefill || '') + '">' : '') +
      '<label class="elab" for="fam-name">Your name</label><input id="fam-name" class="einp" type="text" maxlength="30" autocomplete="off" placeholder="e.g. Asha">' +
      '<button type="submit" class="btn primary big" id="fam-go" style="margin-top:16px">' + (join ? 'Join family' : 'Create family') + '</button>' +
      '<p class="meta" id="fam-msg">' + (join ? 'Your menu is yours. Recipes are shared with everyone in the family.' : 'You get a code to share with your family. Your current recipes and menu move in with you.') + '</p></form>';
  }
  function famSheetHtml() {
    if (!fam.on) return famFormHtml('');
    var mem = fam.members.slice(); if (mem.indexOf(fam.name) < 0) mem.push(fam.name);
    return '<div class="mrows">' +
      '<div class="mrow static" style="--c:#b4a7d6"><span>Family code<small id="fam-code-show" style="font-family:ui-monospace,Menlo,monospace;font-size:17px;color:var(--ink);letter-spacing:.06em">' + esc(fam.code) + '</small></span></div>' +
      '<button type="button" class="mrow" style="--c:#d97757" data-fam="invite"><span>Send invite link<small>Opens the app and asks them to join</small></span><i>›</i></button>' +
      '<button type="button" class="mrow" style="--c:#6a9bcc" data-fam="copycode"><span>Copy code</span><i>›</i></button></div>' +
      '<h3>You are</h3><div class="mealstrip" style="flex-wrap:wrap">' + mem.map(function (m) { return '<button type="button" class="chip" data-fam="switch" data-n="' + esc(m) + '" aria-pressed="' + (m === fam.name) + '">' + esc(m) + '</button>'; }).join('') + '<button type="button" class="chip" data-fam="newperson">+ Someone new</button></div>' +
      '<p class="meta">Each person has their own menu, groceries and notes. Recipes are shared.</p>' +
      '<div class="mrows" style="margin-top:18px"><button type="button" class="mrow" style="--c:#f0a79c" data-fam="leave"><span>' + (fam.leave ? 'Tap again to leave' : 'Leave family') + '<small>Keeps what is on this phone</small></span><i>›</i></button></div>';
  }
  function famOpenSheet() {
    state.sheet = { type: 'family' }; renderSheet();
    if (fam.on) rpc('list_members', { p_code: fam.code }).then(function (m) { fam.members = Array.isArray(m) ? m : []; if (state.sheet && state.sheet.type === 'family') renderSheet(true); }).catch(function () {});
  }
  function showGate() {
    if (document.getElementById('famgate')) return;
    var g = document.createElement('div'); g.id = 'famgate';
    var pf = ''; try { pf = new URLSearchParams(location.search).get('f') || ''; } catch (e) {}
    if (pf) fam.mode = 'join';
    g.innerHTML = '<div class="fg"><h1>Platter</h1><p class="meta" style="font-size:16px">Family meal planner. Share recipes with your family and keep your own menu.</p>' + famFormHtml(normCode(pf)) + '<button type="button" class="linkadd" data-fam="skip">Use only on this phone</button></div>';
    document.body.appendChild(g);
  }
  function hideGate() { var g = document.getElementById('famgate'); if (g) g.remove(); }
  function gateRefresh() { var g = document.getElementById('famgate'); if (!g) return; var pf = ''; var c = document.getElementById('fam-code'); if (c) pf = c.value; g.querySelector('.fg').innerHTML = '<h1>Platter</h1><p class="meta" style="font-size:16px">Family meal planner. Share recipes with your family and keep your own menu.</p>' + famFormHtml(pf) + '<button type="button" class="linkadd" data-fam="skip">Use only on this phone</button>'; }
  function copyText(tx) {
    try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(tx).then(function () { toast('Copied'); }, function () { toast('Could not copy'); }); } catch (e) {}
    toast('Could not copy'); return Promise.resolve();
  }
  document.addEventListener('click', function (e) {
    var el = e.target && e.target.closest ? e.target.closest('[data-fam]') : null; if (!el) return;
    var a = el.getAttribute('data-fam');
    if (a === 'open') famOpenSheet();
    else if (a === 'mode') { fam.mode = el.getAttribute('data-m'); if (document.getElementById('famgate')) gateRefresh(); else renderSheet(true); }
    else if (a === 'skip') { try { localStorage.setItem('platter-skip', '1'); } catch (er) {} hideGate(); }
    else if (a === 'copycode') copyText(fam.code);
    else if (a === 'invite') {
      var link = inviteLink();
      if (navigator.share) navigator.share({ title: 'Join our family on Platter', text: 'Join our family meal planner. Code: ' + fam.code, url: link }).catch(function () {});
      else copyText('Join our family meal planner on Platter: ' + link + ' (code ' + fam.code + ')');
    }
    else if (a === 'switch') { var nm = el.getAttribute('data-n'); famSwitch(nm).then(function () { toast('Now ' + nm); renderSheet(true); }).catch(function () { toast('Could not switch. Check your connection.'); }); }
    else if (a === 'newperson') { var nn = (window.prompt && window.prompt('Name of the new person')) || ''; if (nn.trim()) famSwitch(nn).then(function () { toast('Now ' + nn.trim()); famOpenSheet(); }).catch(function () { toast('Could not switch. Check your connection.'); }); }
    else if (a === 'leave') { if (!fam.leave) { fam.leave = true; renderSheet(true); return; } famLeave(); state.sheet = null; renderSheet(); toast('Left the family'); }
  });
  document.addEventListener('submit', function (e) {
    if (!e.target || e.target.id !== 'fam-form') return;
    e.preventDefault();
    var join = fam.mode === 'join', nm = document.getElementById('fam-name').value, cd = document.getElementById('fam-code') ? document.getElementById('fam-code').value : '';
    var go = document.getElementById('fam-go'), msg = document.getElementById('fam-msg');
    go.disabled = true; go.textContent = join ? 'Joining...' : 'Creating...';
    (join ? famJoin(cd, nm) : famCreate(nm)).then(function () {
      hideGate(); if (state.sheet && state.sheet.type === 'family') { renderSheet(true); famOpenSheet(); } else render();
      toast(join ? 'Joined the family' : 'Family created. Code: ' + fam.code);
      if (!join) { state.sheet = { type: 'family' }; renderSheet(); }
    }).catch(function (er) {
      var g2 = document.getElementById('fam-go'), m2 = document.getElementById('fam-msg');
      if (g2) { g2.disabled = false; g2.textContent = join ? 'Join family' : 'Create family'; }
      if (m2) m2.textContent = (er && er.msg) || 'Something went wrong. Try again.';
    });
  });
  try { document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && fam.on) famSync(); }); } catch (e) {}
  setInterval(function () { if (fam.on && document.visibilityState !== 'hidden') famSync(); }, 25000);
  (function famStart() {
    var skipped = false; try { skipped = !!localStorage.getItem('platter-skip'); } catch (e) {}
    var qf = ''; try { qf = new URLSearchParams(location.search).get('f') || ''; } catch (e) {}
    if (fam.on) famSync({ force: true });
    else if (!window.claude && (!skipped || qf)) showGate();
  })();

  render();
})();
</script>
</body>
</html>
